<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Countdown</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #111;
        color: white;
        padding: 40px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 25px;
      }

      .card {
        background: #1c1c1c;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        transition: 0.3s;
        position: relative;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card img {
        width: 100%;
        height: 380px;
        object-fit: cover;
      }

      .info {
        padding: 20px;
      }

      .info h2 {
        margin-bottom: 15px;
        font-size: 24px;
      }

      .release {
        color: #999;
        margin-bottom: 12px;
      }

      .countdown {
        font-size: 22px;
        font-weight: bold;
        color: #00d4ff;
      }

      .out {
        color: #00ff88;
      }

      .top-bar{
          display:flex;
          justify-content:flex-end;
          margin-bottom:20px;
      }
      
      .btn{
          background:#00bfff;
          color:white;
          text-decoration:none;
          padding:12px 22px;
          border-radius:10px;
          font-weight:bold;
          transition:.25s;
      }
      
      .btn:hover{
          background:#009fd9;
      }
      .delete-btn{
    position:absolute;
    top:12px;
    right:12px;

    width:34px;
    height:34px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.75);
    color:#fff;

    font-size:22px;
    line-height:34px;

    cursor:pointer;

    opacity:0;
    transform:scale(.8);

    transition:.2s;
    z-index:10;
}

.card:hover .delete-btn{
    opacity:1;
    transform:scale(1);
}

.delete-btn:hover{
    background:#e53935;
}

.card-actions{
    position:absolute;
    top:12px;
    right:12px;

    display:flex;
    gap:8px;

    opacity:0;
    transform:translateY(-5px);

    transition:.2s;

    z-index:20;
}

.card:hover .card-actions{
    opacity:1;
    transform:translateY(0);
}

.edit-btn,
.delete-btn{
    width:34px;
    height:34px;

    border:none;
    border-radius:50%;

    color:white;
    cursor:pointer;

    font-size:18px;

    background:rgba(0,0,0,.75);

    transition:.2s;
}

.edit-btn:hover{
    background:#ff9800;
}

.delete-btn:hover{
    background:#e53935;
}
    </style>
  </head>

  <body>
    <div class="top-bar">
      <a href="admin.html" class="btn">➕ Add Game</a>
    </div>
    
    <h1>Upcoming Games</h1>

    <div class="container" id="games"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const sb = window.supabase.createClient(
        "https://jwncunroufyxkibdutzv.supabase.co",

        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3bmN1bnJvdWZ5eGtpYmR1dHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzI2ODEsImV4cCI6MjEwMDkwODY4MX0.vMHa7c3E9ePwo3g93teQ343pl4O3JBpOTONDNv0Nyuc",
      );
      (async () => {
        const { data: games, error } = await sb

          .from("games")

          .select("*")

          .order("release");

        const container = document.getElementById("games");

        games.forEach((game) => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <div class="card-actions">
        <button class="edit-btn" title="Edit">✏️</button>
        <button class="delete-btn" title="Delete">&times;</button>
    </div>
            <img src="${game.image}" alt="${game.name}">
            <div class="info">
                <h2>${game.name}</h2>

                <div class="release">
                    ${new Date(game.release).toLocaleString("en-GB", {
                      timeZone: "Asia/Ho_Chi_Minh",
                      dateStyle: "full",
                      timeStyle: "short",
                    })}
                </div>

                <div class="countdown"></div>
            </div>
        `;

          container.appendChild(card);

          game.element = card.querySelector(".countdown");
          
          card.querySelector(".delete-btn").addEventListener("click", async (e) => {

              e.stopPropagation();
          
              if (!confirm(`Delete "${game.name}"?`)) return;
          
              const { error } = await sb
                  .from("games")
                  .delete()
                  .eq("id", game.id);
          
              if (error) {
                  alert(error.message);
                  return;
              }
          
              card.remove();
          });

        card.querySelector(".edit-btn").addEventListener("click", async (e) => {

    e.stopPropagation();

    const name = prompt("Game Name", game.name);
    if(name === null) return;

    const image = prompt("Image URL", game.image);
    if(image === null) return;

    const release = prompt(
        "Release (YYYY-MM-DDTHH:mm:ss+07:00)",
        game.release
    );

    if(release === null) return;

    const { error } = await supabase
        .from("games")
        .update({
            name,
            image,
            release
        })
        .eq("id", game.id);

    if(error){
        alert(error.message);
        return;
    }

    location.reload();
});
        });

        function updateCountdown() {
          const now = new Date();

          games.forEach((game) => {
            const release = new Date(game.release);

            const diff = release - now;

            if (diff <= 0) {
              game.element.innerHTML = '<span class="out">OUT NOW!</span>';

              return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

            const minutes = Math.floor((diff / (1000 * 60)) % 60);

            const seconds = Math.floor((diff / 1000) % 60);

            game.element.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
          });
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

        const now = new Date();

const nextGame = games.find(game => new Date(game.release) > now);

if (nextGame) {
  const card = nextGame.element.closest(".card");

  card.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

  card.style.border = "3px solid #00d4ff";
}
      })();
    </script>
  </body>
</html>
