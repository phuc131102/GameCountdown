<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Countdown</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #111;
        color: white;
        padding: 40px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 25px;
      }

      .card {
        background: #1c1c1c;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card img {
        width: 100%;
        height: 380px;
        object-fit: cover;
      }

      .info {
        padding: 20px;
      }

      .info h2 {
        margin-bottom: 15px;
        font-size: 24px;
      }

      .release {
        color: #999;
        margin-bottom: 12px;
      }

      .countdown {
        font-size: 22px;
        font-weight: bold;
        color: #00d4ff;
      }

      .out {
        color: #00ff88;
      }
    </style>
  </head>

  <body>
    <h1>Upcoming Games</h1>

    <div class="container" id="games"></div>

    <script>
      (async () => {
        const games = await fetch("games.json").then((res) => res.json());

        const container = document.getElementById("games");

        games.forEach((game) => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <img src="${game.image}" alt="${game.name}">
            <div class="info">
                <h2>${game.name}</h2>

                <div class="release">
                    ${new Date(game.release).toLocaleString("en-GB", {
                      timeZone: "Asia/Ho_Chi_Minh",
                      dateStyle: "full",
                      timeStyle: "short",
                    })}
                </div>

                <div class="countdown"></div>
            </div>
        `;

          container.appendChild(card);

          game.element = card.querySelector(".countdown");
        });

        function updateCountdown() {
          const now = new Date();

          games.forEach((game) => {
            const release = new Date(game.release);

            const diff = release - now;

            if (diff <= 0) {
              game.element.innerHTML = '<span class="out">OUT NOW!</span>';

              return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

            const minutes = Math.floor((diff / (1000 * 60)) % 60);

            const seconds = Math.floor((diff / 1000) % 60);

            game.element.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
          });
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);
      })();
    </script>
  </body>
</html>
